<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{subject}}</title>
  </head>
  <body dir="rtl" style="margin: 0; padding: 0; background-color: #f4f4f5">
    <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f4f5">
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table role="presentation" dir="rtl" width="560" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 560px; background-color: #ffffff; border: 1px solid #e4e4e7; border-radius: 8px">
            <tr>
              <td align="right" dir="rtl" style="padding: 18px 24px; border-bottom: 1px solid #e4e4e7; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: bold; color: #18181b; text-align: right"><span dir="ltr">NaqdPOS</span></td>
            </tr>
            <tr>
              <td align="right" dir="rtl" lang="ur" style="padding: 24px; font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Urdu Typesetting', 'Noto Naskh Arabic', 'Geeza Pro', Tahoma, Arial, sans-serif; font-size: 18px; line-height: 2; color: #18181b; text-align: right">
{{content}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
